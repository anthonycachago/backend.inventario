# Compila y publica Inventario.Web en Azure App Service en cada push a main.
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   - Variable AZURE_WEBAPP_NAME: nombre del App Service
#   - Secret   AZURE_WEBAPP_PUBLISH_PROFILE: contenido del perfil de publicación descargado de Azure
name: Deploy a Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Inventario.Web/Inventario.Web.csproj

      - name: Publicar
        run: dotnet publish Inventario.Web/Inventario.Web.csproj -c Release --no-restore -o ${{ runner.temp }}/publish

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ runner.temp }}/publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
